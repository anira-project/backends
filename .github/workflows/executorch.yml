name: executorch

# Thin wrapper: derive version + release flag + matrix (engine-meta, from CMakePresets
# vendor.anira), then hand off to the shared _build-backend.yml pipeline. CPU-only STATIC,
# built from source on every leg (PyTorch ships no prebuilt desktop C++ runtime to
# repackage) and staged as a flat include/ + lib/libexecutorch.a tree — one merged archive
# with the registrations pre-linked (engines/executorch/merge-static.sh), like the other
# static engines.
#
# Triggers:
#   - push/PR touching executorch sources or shared CI -> validate only (no release)
#   - tag executorch-v<version>[-<n>] (e.g. executorch-v<VERSION>) -> build at engines/executorch/VERSION
#     (the tag's version must match it), publish every archive to the release named after the tag
#   - workflow_dispatch with preset_filter -> build only the matching legs (convergence rounds)

on:
  push:
    branches: [main]
    paths:
      - 'engines/executorch/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/executorch.yml'
      - '.github/workflows/_build-backend.yml'
    tags:
      - 'executorch-v[0-9]*'
  pull_request:
    paths:
      - 'engines/executorch/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/executorch.yml'
      - '.github/workflows/_build-backend.yml'
  workflow_dispatch:
    inputs:
      preset_filter:
        description: "Regex over preset names: build only matching legs (aggregation off; add 'ios' to run the iOS job)"
        required: false
        default: ""

concurrency:
  group: executorch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      release: ${{ steps.m.outputs.release }}
      release_tag: ${{ steps.m.outputs.release_tag }}
      matrix: ${{ steps.m.outputs.matrix }}
      aggregate: ${{ steps.m.outputs.aggregate }}
      run_ios: ${{ steps.m.outputs.run_ios }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        uses: ./.github/actions/engine-meta
        with:
          engine: executorch
          preset_prefix: executorch
          preset_filter: ${{ inputs.preset_filter }}

  build:
    needs: meta
    uses: ./.github/workflows/_build-backend.yml
    with:
      engine: executorch
      libname: executorch
      version: ${{ needs.meta.outputs.version }}
      release: ${{ needs.meta.outputs.release == 'true' }}
      release_tag: ${{ needs.meta.outputs.release_tag }}
      matrix: ${{ needs.meta.outputs.matrix }}
      aggregate: ${{ needs.meta.outputs.aggregate == 'true' }}
      package_dirs: "include lib"
      macos_universal_kinds: '["static"]'
      # Mobile: per-ABI Android static legs combine into one multi-ABI archive; iOS builds a
      # static .xcframework (device + simulator arm64) via engines/executorch/ios.sh.
      android_bundles: '[{"kind":"static","variant":""},{"kind":"static","variant":"gpu"}]'
      has_ios: ${{ needs.meta.outputs.run_ios == 'true' }}
      ios_variants: '["", "gpu"]'
    secrets: inherit
