name: onnxruntime

# Thin wrapper: derive version + release flag + matrix (engine-meta, from CMakePresets
# vendor.anira), then hand off to the shared _build-backend.yml pipeline. onnxruntime ships
# static (built from source, all platforms incl. iOS xcframework) AND shared (macOS and
# Android built from source; Linux/Windows repackaged from upstream prebuilts).
#
# Triggers:
#   - push/PR touching onnxruntime sources or shared CI -> validate only (no release)
#   - tag onnxruntime-v<version>[-<n>] (e.g. onnxruntime-v<VERSION>) -> build at engines/onnxruntime/VERSION
#     (the tag's version must match it), publish every archive to the release named after the tag
#   - workflow_dispatch with preset_filter -> build only the matching legs (convergence rounds)

on:
  push:
    branches: [main]
    paths:
      - 'engines/onnxruntime/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/onnxruntime.yml'
      - '.github/workflows/_build-backend.yml'
    tags:
      - 'onnxruntime-v[0-9]*'
  pull_request:
    paths:
      - 'engines/onnxruntime/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/onnxruntime.yml'
      - '.github/workflows/_build-backend.yml'
  workflow_dispatch:
    inputs:
      preset_filter:
        description: "Regex over preset names: build only matching legs (aggregation off; add 'ios' to run the iOS job)"
        required: false
        default: ""

concurrency:
  group: onnxruntime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      release: ${{ steps.m.outputs.release }}
      release_tag: ${{ steps.m.outputs.release_tag }}
      matrix: ${{ steps.m.outputs.matrix }}
      aggregate: ${{ steps.m.outputs.aggregate }}
      run_ios: ${{ steps.m.outputs.run_ios }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        uses: ./.github/actions/engine-meta
        with:
          engine: onnxruntime
          preset_prefix: onnx
          preset_filter: ${{ inputs.preset_filter }}

  build:
    needs: meta
    uses: ./.github/workflows/_build-backend.yml
    with:
      engine: onnxruntime
      libname: onnxruntime
      version: ${{ needs.meta.outputs.version }}
      release: ${{ needs.meta.outputs.release == 'true' }}
      release_tag: ${{ needs.meta.outputs.release_tag }}
      matrix: ${{ needs.meta.outputs.matrix }}
      aggregate: ${{ needs.meta.outputs.aggregate == 'true' }}
      macos_universal_kinds: '["static","shared"]'
      android_bundle_kinds: '["static","shared"]'
      has_ios: ${{ needs.meta.outputs.run_ios == 'true' }}
      ios_variants: '["", "gpu"]'
    secrets: inherit
