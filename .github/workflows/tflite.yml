name: tflite

# Thin wrapper: derive version + release flag + matrix (engine-meta, from CMakePresets
# vendor.anira), then hand off to the shared _build-backend.yml pipeline.
#
# Triggers:
#   - push/PR touching tflite sources or shared CI -> validate only (no release)
#   - tag tflite-v<version>[-<n>] (e.g. tflite-v<VERSION>) -> build at engines/tflite/VERSION
#     (the tag's version must match it), publish every archive to the release named after the tag
#   - workflow_dispatch with preset_filter -> build only the matching legs (convergence rounds)

on:
  push:
    branches: [main]
    paths:
      - 'engines/tflite/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/tflite.yml'
      - '.github/workflows/_build-backend.yml'
    tags:
      - 'tflite-v[0-9]*'
  pull_request:
    paths:
      - 'engines/tflite/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/tflite.yml'
      - '.github/workflows/_build-backend.yml'
  workflow_dispatch:
    inputs:
      preset_filter:
        description: "Regex over preset names: build only matching legs (aggregation off; add 'ios' to run the iOS job)"
        required: false
        default: ""

concurrency:
  group: tflite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      release: ${{ steps.m.outputs.release }}
      release_tag: ${{ steps.m.outputs.release_tag }}
      matrix: ${{ steps.m.outputs.matrix }}
      aggregate: ${{ steps.m.outputs.aggregate }}
      run_ios: ${{ steps.m.outputs.run_ios }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        uses: ./.github/actions/engine-meta
        with:
          engine: tflite
          preset_prefix: tflite
          preset_filter: ${{ inputs.preset_filter }}

  build:
    needs: meta
    uses: ./.github/workflows/_build-backend.yml
    with:
      engine: tflite
      libname: tensorflowlite_c
      version: ${{ needs.meta.outputs.version }}
      release: ${{ needs.meta.outputs.release == 'true' }}
      release_tag: ${{ needs.meta.outputs.release_tag }}
      matrix: ${{ needs.meta.outputs.matrix }}
      aggregate: ${{ needs.meta.outputs.aggregate == 'true' }}
      macos_universal_kinds: '["static","shared"]'
      android_bundle_kinds: '["static","shared"]'
      has_ios: ${{ needs.meta.outputs.run_ios == 'true' }}
      ios_variants: '["", "gpu"]'
    secrets: inherit
