name: litert

# Thin wrapper: derive version + release flag + matrix (engine-meta, from CMakePresets
# vendor.anira), then hand off to the shared _build-backend.yml pipeline. Builds LiteRT's
# NATIVE C API (libLiteRt, LiteRt* symbols) from google-ai-edge/LiteRT — distinct from the
# `tflite` engine (legacy TfLite* C API). CPU-only. `shared` is sourced from official prebuilts
# (litert/prebuilt/, pinned SHA) where they exist, plus from-source Bazel for macOS x86_64; `static`
# is built from source on every platform (no static prebuilt upstream), including the iOS xcframework
# (device + simulator, via engines/litert/ios.sh).
#
# Triggers (release model in the root README):
#   - push/PR touching litert sources or shared CI -> validate only (no release)
#   - tag litert-v<version>[-<n>] (e.g. litert-v<VERSION>) -> build at engines/litert/VERSION
#     (the tag's version must match it), publish every archive to the release named after the tag
#   - workflow_dispatch with preset_filter -> build only the matching legs (convergence rounds)

on:
  push:
    branches: [main]
    paths:
      - 'engines/litert/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/litert.yml'
      - '.github/workflows/_build-backend.yml'
    tags:
      - 'litert-v[0-9]*'
  pull_request:
    paths:
      - 'engines/litert/**'
      - 'scripts/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/actions/**'
      - '.github/workflows/litert.yml'
      - '.github/workflows/_build-backend.yml'
  workflow_dispatch:
    inputs:
      preset_filter:
        description: "Regex over preset names: build only matching legs (aggregation off; add 'ios' to run the iOS job)"
        required: false
        default: ""

concurrency:
  group: litert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      release: ${{ steps.m.outputs.release }}
      release_tag: ${{ steps.m.outputs.release_tag }}
      matrix: ${{ steps.m.outputs.matrix }}
      aggregate: ${{ steps.m.outputs.aggregate }}
      run_ios: ${{ steps.m.outputs.run_ios }}
    steps:
      - uses: actions/checkout@v6
      - id: m
        uses: ./.github/actions/engine-meta
        with:
          engine: litert
          preset_prefix: litert
          preset_filter: ${{ inputs.preset_filter }}

  build:
    needs: meta
    uses: ./.github/workflows/_build-backend.yml
    with:
      engine: litert
      libname: LiteRt
      version: ${{ needs.meta.outputs.version }}
      release: ${{ needs.meta.outputs.release == 'true' }}
      release_tag: ${{ needs.meta.outputs.release_tag }}
      matrix: ${{ needs.meta.outputs.matrix }}
      aggregate: ${{ needs.meta.outputs.aggregate == 'true' }}
      macos_universal_kinds: '["shared", "static"]'
      android_bundles: '[{"kind":"shared","variant":""},{"kind":"static","variant":""},{"kind":"shared","variant":"gpu"}]'
      has_ios: ${{ needs.meta.outputs.run_ios == 'true' }}
      ios_variants: '["", "gpu"]'
    secrets: inherit
