name: publish-release
description: >
  Upsert a GitHub release for the given tag and upload one archive to it. Idempotent:
  creates the release if missing, then uploads with --clobber. Replaces the gh release
  view||create + upload block that every job used to duplicate.

inputs:
  tag:
    description: "Release tag: <engine>-v<version>[-<n>], e.g. onnxruntime-v1.30.0 (one release per backend)"
    required: true
  notes:
    description: "Release notes body (e.g. '<engine> <version>'); used only when the release is created"
    required: false
    default: ""
  file:
    description: "Path to the .zip artifact to upload"
    required: true
  token:
    description: "GitHub token with contents:write"
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        tag="${{ inputs.tag }}"
        notes="${{ inputs.notes }}"
        gh release view "$tag" >/dev/null 2>&1 || \
          gh release create "$tag" --title "$tag" --notes "anira backends: ${notes:-$tag}" || \
          gh release view "$tag" >/dev/null   # lost the create race to a sibling job: fine
        # uploads.github.com answers HTTP 5xx now and then (a whole release run then loses a
        # leg to a transient); retry with backoff before failing the job.
        for attempt in 1 2 3 4; do
          gh release upload "$tag" "${{ inputs.file }}" --clobber && exit 0
          echo "upload attempt $attempt failed; retrying in $((attempt * 30))s"
          sleep $((attempt * 30))
        done
        echo "::error::upload of ${{ inputs.file }} to $tag failed after 4 attempts"; exit 1
